substring.end.description=Позиция первого символа, который уже не войдёт. Оставьте пустым, чтобы взять всё до конца.

changeCase.name=Изменить регистр
changeCase.description=Переводит текст в верхний или нижний регистр, пишет каждое слово с заглавной буквы или превращает каждую строку в имя вроде camelCase или snake_case.
changeCase.to.title=Регистр
changeCase.to.description=camelCase и другие стили идентификаторов превращают каждую строку в одно имя из её слов.
changeCase.language.title=Язык
changeCase.language.description=В турецком и азербайджанском есть İ с точкой и ı без точки, поэтому i и I там меняются иначе.
