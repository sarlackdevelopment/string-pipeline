options.operation.reverse=Перевернуть порядок

encode.name=Закодировать
encode.description=Кодирует текст в Base64, для URL или в шестнадцатеричные цифры. Текст читается как UTF-8.
encode.format.title=Формат
encode.format.description=URL-кодирование записывает пробел как %20 и оставляет как есть только латинские буквы, цифры и - . _ ~.
decode.name=Декодировать
decode.description=Превращает Base64, URL-кодирование или шестнадцатеричные цифры обратно в текст. Байты должны быть в UTF-8.
decode.format.title=Формат
decode.format.description=Пробелы и переводы строк в Base64 и шестнадцатеричной записи пропускаются. В URL-кодировании + остаётся знаком +.
