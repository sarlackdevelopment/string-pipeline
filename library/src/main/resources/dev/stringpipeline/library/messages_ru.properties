substring.name=Подстрока
substring.description=Оставляет часть текста и считает символы так, как их видит человек. Работает как срез в Python: text[start:end].
substring.start.title=Начало
substring.start.description=Позиция первого символа, который останется, считая от 0. Отрицательные числа отсчитываются с конца: -1 — последний символ.
