reformatDates.from.description=Как даты записаны сейчас, например yyyy-MM-dd: yyyy — год, MM — месяц, MMM — название месяца, dd — день, HH — час, mm — минута. Другой текст заключайте в одинарные кавычки.
reformatDates.to.title=Выходной шаблон
reformatDates.to.description=Как их записать, например dd.MM.yyyy или d MMMM yyyy.
reformatDates.patternUnreadable=Не удаётся разобрать этот шаблон
reformatDates.notADate=Строка {0,number,#} — не дата по шаблону {1}: {2}
reformatDates.differsAt=с позиции {0,number,#} она не совпадает с шаблоном.
reformatDates.outputNeedsMore=Выходному шаблону нужно больше, чем читает входной ({0}).
jdk.datePattern.unknownLetter=Неизвестная буква в шаблоне: {0}
jdk.datePattern.tooManyLetters=Слишком много одинаковых букв в шаблоне: {0}
jdk.datePattern.reservedCharacter=В шаблоне есть зарезервированный символ ''{0}''
jdk.datePattern.unclosedQuote=Шаблон заканчивается незакрытым текстом в кавычках: {0}
jdk.datePattern.unopenedBracket=В шаблоне есть ] без открывающей [

