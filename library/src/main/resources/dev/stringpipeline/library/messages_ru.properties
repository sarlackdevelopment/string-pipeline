options.case.constant=CONSTANT_CASE
options.language.any=Любой язык
options.language.turkish=Турецкий или азербайджанский

lineOperations.name=Операции со строками
lineOperations.description=Сортирует строки, удаляет повторяющиеся или пустые либо переворачивает их порядок.
