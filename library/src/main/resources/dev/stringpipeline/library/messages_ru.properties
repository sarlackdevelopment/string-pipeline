encoding.notUtf8=Декодированные байты — не текст в UTF-8, поэтому их нельзя показать как текст.

reformatDates.name=Изменить формат дат
reformatDates.description=Читает каждую строку как дату или время по одному шаблону и записывает по другому. Пустые строки остаются пустыми. Названия месяцев и дней недели — английские.
