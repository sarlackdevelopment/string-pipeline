regex.seconds={0,choice,1#1 Sekunde|1<{0,number,integer} Sekunden}
regex.milliseconds={0,choice,0#0 Millisekunden|1#1 Millisekunde|1<{0,number,integer} Millisekunden}
jdk.regex.unclosedGroup=Nicht geschlossene Gruppe
jdk.regex.unclosedCharacterClass=Nicht geschlossene Zeichenklasse
jdk.regex.unmatchedClosingParenthesis=Schließende Klammer ')' ohne öffnende
jdk.regex.danglingMetaCharacter=Metazeichen ''{0}'' ohne vorangehenden Ausdruck
jdk.regex.illegalRepetition=Ungültige Wiederholung
jdk.regex.illegalRepetitionRange=Ungültiger Wiederholungsbereich
jdk.regex.unclosedCountedClosure=Nicht geschlossener Quantor {n,m}
jdk.regex.trailingBackslash=Einzelner Backslash am Ende
