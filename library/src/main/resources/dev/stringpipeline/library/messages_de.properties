regexExtract.name=Treffer extrahieren
regexExtract.description=Findet die Treffer eines regulären Ausdrucks (Regex) und gibt sie zeilenweise aus. Gibt leeren Text aus, wenn nichts passt.
regexExtract.group.title=Gruppe
regexExtract.group.description=0 gibt den ganzen Treffer aus; ab 1 das, was das jeweilige Klammerpaar erfasst hat.
regexExtract.matches.title=Treffer
regexExtract.matches.description=Nur den ersten Treffer ausgeben oder alle.
options.matches.first=Erster Treffer
options.matches.all=Alle Treffer
regexExtract.noGroups=Das Muster hat keine Gruppen, verwenden Sie also 0 für den ganzen Treffer
regexExtract.oneGroup=Das Muster hat 1 Gruppe, verwenden Sie also 0 oder 1
regexExtract.groups=Das Muster hat {0,number,integer} Gruppen, verwenden Sie also eine Zahl von 0 bis {0,number,integer}

regexReplace.name=Treffer ersetzen
regexReplace.description=Ersetzt jeden Treffer eines regulären Ausdrucks (Regex). Die Ersetzung kann Teile des Treffers einfügen.
regexReplace.replacement.title=Ersetzen durch
regexReplace.replacement.description=Mit $1 oder ${name} fügen Sie eine Gruppe ein, mit \\$ ein Dollarzeichen. Lassen Sie das Feld leer, um jeden Treffer zu löschen.
replacement.dollarWithoutGroup=Auf $ muss eine Gruppennummer oder {name} folgen. Schreiben Sie \\$ für ein Dollarzeichen.
replacement.groupNameNeeded=Schreiben Sie zwischen ${ und } einen Gruppennamen aus lateinischen Buchstaben und Ziffern. Schreiben Sie \\$ für ein Dollarzeichen.
replacement.trailingBackslash=Auf \\ am Ende muss ein Zeichen folgen. Schreiben Sie \\\\ für einen Backslash.
replacement.noGroupNamed=Das Muster hat keine Gruppe namens {0}. Schreiben Sie \\$ für ein Dollarzeichen.
replacement.noGroup=Das Muster hat keine Gruppe {0,number,#}. Schreiben Sie \\$ für ein Dollarzeichen.

