replace.name=Ersetzen
replace.description=Ersetzt jedes Vorkommen eines Textes durch einen anderen Text. Der Vergleich ist exakt, auch bei Groß- und Kleinschreibung.
replace.old.title=Suchen nach
replace.old.description=Der Text, nach dem gesucht wird.
replace.new.title=Ersetzen durch
replace.new.description=Lassen Sie das Feld leer, um jeden Treffer zu löschen.

append.name=Anhängen
append.description=Fügt Text am Ende an.
append.text.title=Text
append.text.description=Wird nach dem letzten Zeichen eingefügt. Leerzeichen bleiben erhalten.

prepend.name=Voranstellen
prepend.description=Fügt Text am Anfang ein.
prepend.text.title=Text
prepend.text.description=Wird vor dem ersten Zeichen eingefügt. Leerzeichen bleiben erhalten.

substring.name=Teilstring
substring.description=Behält einen Teil des Textes und zählt die Zeichen so, wie man sie sieht. Funktioniert wie ein Slice in Python: text[start:end].
substring.start.title=Anfang
substring.start.description=Position des ersten Zeichens, das bleibt, gezählt ab 0. Negative Zahlen zählen vom Ende: -1 ist das letzte Zeichen.
substring.end.title=Ende
substring.end.description=Position des ersten Zeichens, das wegfällt. Lassen Sie das Feld leer, um alles bis zum Ende zu behalten.

changeCase.name=Schreibweise ändern
changeCase.description=Schreibt den Text in Groß- oder Kleinbuchstaben oder mit großen Anfangsbuchstaben, oder macht aus jeder Zeile einen Namen wie camelCase oder snake_case.
changeCase.to.title=Schreibweise
changeCase.to.description=camelCase und die anderen Bezeichner-Stile machen aus jeder Zeile einen einzigen Namen aus ihren Wörtern.
changeCase.language.title=Sprache
changeCase.language.description=Türkisch und Aserbaidschanisch haben ein İ mit Punkt und ein ı ohne Punkt, daher ändern sich i und I dort anders.
options.case.upper=GROSSBUCHSTABEN
options.case.lower=kleinbuchstaben
options.case.title=Jedes Wort Groß
options.case.camel=camelCase
options.case.pascal=PascalCase
options.case.snake=snake_case
options.case.kebab=kebab-case
options.case.constant=CONSTANT_CASE
options.language.any=Beliebige Sprache
options.language.turkish=Türkisch oder Aserbaidschanisch

lineOperations.name=Zeilen bearbeiten
lineOperations.description=Sortiert die Zeilen, entfernt doppelte oder leere oder kehrt ihre Reihenfolge um.
lineOperations.operation.title=Aktion
lineOperations.operation.description=Beim Sortieren zählt der Wert von Zahlen, Zeile 2 kommt also vor Zeile 10. Beim Entfernen von Duplikaten bleibt jeweils das erste erhalten.
lineOperations.ignoreCase.title=Groß-/Kleinschreibung ignorieren
lineOperations.ignoreCase.description=Behandelt Groß- und Kleinbuchstaben beim Sortieren und bei der Suche nach Duplikaten gleich.
options.operation.sort=Von A bis Z sortieren
options.operation.sortDescending=Von Z bis A sortieren
options.operation.unique=Duplikate entfernen
options.operation.removeBlank=Leere Zeilen entfernen
options.operation.reverse=Reihenfolge umkehren

encode.name=Codieren
encode.description=Codiert den Text als Base64, für eine URL oder als Hexadezimalziffern. Der Text wird als UTF-8 gelesen.
encode.format.title=Format
encode.format.description=Die URL-Codierung schreibt ein Leerzeichen als %20 und lässt nur lateinische Buchstaben, Ziffern und - . _ ~ unverändert.
decode.name=Decodieren
decode.description=Wandelt Base64, URL-Codierung oder Hexadezimalziffern zurück in Text. Die Bytes müssen UTF-8 sein.
decode.format.title=Format
decode.format.description=Leerzeichen und Zeilenumbrüche in Base64 und Hexadezimal werden ignoriert. In der URL-Codierung bleibt + ein +.
options.encoding.base64=Base64
options.encoding.base64Url=Base64, URL-sicher
options.encoding.url=URL (Prozentcodierung)
options.encoding.hex=Hexadezimal
encoding.notBase64Character=Das ist kein Base64: Der Text enthält „{0}“.
encoding.base64EndsEarly=Das ist kein Base64: Der Text endet zu früh, oder = steht vor dem Ende.
encoding.notHexDigit=Das ist nicht hexadezimal: „{0}“ ist keine Ziffer von 0 bis f.
encoding.hexDigitMissing=Das ist nicht hexadezimal: Jedes Byte braucht zwei Ziffern, und eine fehlt.
encoding.percentNotFollowed=An Position {0,number,#} folgen auf % keine zwei Hexadezimalziffern. Schreiben Sie %25 für ein Prozentzeichen.
encoding.notUtf8=Die decodierten Bytes sind kein UTF-8-Text und können daher nicht als Text angezeigt werden.

reformatDates.name=Datumsformat ändern
reformatDates.description=Liest jede Zeile als Datum oder Uhrzeit in einem Muster und schreibt sie in einem anderen. Leere Zeilen bleiben leer. Monats- und Tagesnamen sind englisch.
reformatDates.from.title=Eingabemuster
reformatDates.from.description=Wie die Daten jetzt geschrieben sind, etwa yyyy-MM-dd: yyyy Jahr, MM Monat, MMM Monatsname, dd Tag, HH Stunde, mm Minute. Setzen Sie anderen Text in einfache Anführungszeichen.
reformatDates.to.title=Ausgabemuster
reformatDates.to.description=Wie sie geschrieben werden sollen, etwa dd.MM.yyyy oder d MMMM yyyy.
reformatDates.patternUnreadable=Dieses Muster kann nicht gelesen werden
reformatDates.notADate=Zeile {0,number,#} ist kein Datum im Muster {1}: {2}
reformatDates.differsAt=Ab Position {0,number,#} passt sie nicht zum Muster.
reformatDates.outputNeedsMore=Das Ausgabemuster braucht mehr, als das Eingabemuster liest ({0}).
jdk.datePattern.unknownLetter=Unbekannter Buchstabe im Muster: {0}
jdk.datePattern.tooManyLetters=Zu viele gleiche Buchstaben im Muster: {0}
jdk.datePattern.reservedCharacter=Das Muster enthält das reservierte Zeichen ''{0}''
jdk.datePattern.unclosedQuote=Das Muster endet mit einem Text in Anführungszeichen, der nicht geschlossen ist: {0}
jdk.datePattern.unopenedBracket=Das Muster enthält ] ohne vorangehendes [

