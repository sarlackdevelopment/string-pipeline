lineOperations.name=Line operations
lineOperations.description=Sorts the lines, removes duplicate or blank ones, or reverses their order.
lineOperations.operation.title=Operation
lineOperations.operation.description=Sorting puts numbers in order of their value, so line 2 comes before line 10. Removing duplicates keeps the first of them.
lineOperations.ignoreCase.title=Ignore case
lineOperations.ignoreCase.description=Treats upper and lower case as the same when sorting or finding duplicates.
options.operation.sort=Sort A to Z
options.operation.sortDescending=Sort Z to A
