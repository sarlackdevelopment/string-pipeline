replacement.groupNameNeeded=Write a group name of letters and digits between ${ and }. Write \\$ for a dollar sign.
replacement.trailingBackslash=A \\ at the end must be followed by a character. Write \\\\ for a backslash.
replacement.noGroupNamed=The pattern has no group named {0}. Write \\$ for a dollar sign.
replacement.noGroup=The pattern has no group {0,number,#}. Write \\$ for a dollar sign.

