# The library's texts in English, which is also the fallback for every other language (D52).
#
# A text that the code passes values to is a java.text.MessageFormat pattern: {0} is the first value and a ' is
# written twice. {0,number,integer} writes a count with the language's thousands separator, {0,number,#} a position,
# such as a line number, without one. A text without values is used as it is.
#
# Keys name what a text belongs to: a transformation and its parameters (<id>.name, <id>.<parameter>.title), the
# options of a choice (options.<choice>.<value>), and Java's own messages that the library translates (jdk.*).

