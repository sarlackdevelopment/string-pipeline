regexExtract.oneGroup=The pattern has 1 group, so use 0 or 1
regexExtract.groups=The pattern has {0,number,integer} groups, so use a number from 0 to {0,number,integer}

regexReplace.name=Regex replace
regexReplace.description=Replaces every match of a regular expression. The replacement can insert parts of the match.
regexReplace.replacement.title=Replace with
regexReplace.replacement.description=Use $1 or ${name} to insert a group and \\$ for a dollar sign. Leave empty to delete every match.
