reformatDates.from.description=How the dates are written now, such as yyyy-MM-dd: yyyy year, MM month, MMM month name, dd day, HH hour, mm minute. Put other text in single quotes.
reformatDates.to.title=Output pattern
reformatDates.to.description=How to write them, such as dd.MM.yyyy or d MMMM yyyy.
