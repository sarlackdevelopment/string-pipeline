options.operation.removeBlank=Remove blank lines
options.operation.reverse=Reverse the order

encode.name=Encode
encode.description=Encodes the text as Base64, for a URL, or as hexadecimal digits. The text is read as UTF-8.
encode.format.title=Format
encode.format.description=URL encoding writes a space as %20 and keeps only letters, digits and - . _ ~ as they are.
decode.name=Decode
decode.description=Decodes Base64, URL encoding or hexadecimal digits back into text. The bytes must be UTF-8.
decode.format.title=Format
decode.format.description=Spaces and line breaks in Base64 and hexadecimal are ignored. In URL encoding, + stays a +.
options.encoding.base64=Base64
options.encoding.base64Url=Base64, URL-safe
options.encoding.url=URL (percent-encoding)
options.encoding.hex=Hexadecimal
encoding.notBase64Character=This is not Base64: it contains "{0}".
encoding.base64EndsEarly=This is not Base64: it ends too early, or = appears before the end.
encoding.notHexDigit=This is not hexadecimal: "{0}" is not a digit from 0 to f.
encoding.hexDigitMissing=This is not hexadecimal: every byte needs two digits, and one is missing.
encoding.percentNotFollowed=At character {0,number,#}, % is not followed by two hexadecimal digits. Write %25 for a percent sign.
encoding.notUtf8=The decoded bytes are not UTF-8 text, so they cannot be shown as text.

