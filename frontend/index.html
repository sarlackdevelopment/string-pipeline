<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The SVG for current browsers, the PNG for those that do not show SVG icons. -->
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>String Pipeline</title>
    <script>
      // The theme before the first paint (D51), so a dark page does not flash white while the app loads. The app's
      // useTheme takes over from there, with the same key and the same values: light, dark, or auto for the system's.
      try {
        const theme = localStorage.getItem('string-pipeline-theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch {
        // Without storage or media queries, the app decides once it runs.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
